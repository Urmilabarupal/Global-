<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" width="100%" height="100%">
  <defs>
    <!-- Sun Ray Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E85D04" />
      <stop offset="50%" stop-color="#F48C06" />
      <stop offset="100%" stop-color="#FAA307" />
    </linearGradient>

    <!-- Globe Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B6CB0" />
      <stop offset="50%" stop-color="#1E4E8C" />
      <stop offset="100%" stop-color="#153E75" />
    </linearGradient>

    <!-- Golden Swoosh Gradient -->
    <linearGradient id="goldSwooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F39C12" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>
  </defs>

  <!-- ================= TOP SUNBURST RAYS ================= -->
  <g id="sunburst">
    <!-- Center Semicircular Sun Arc -->
    <path d="M 235 480 A 265 265 0 0 1 765 480 Z" fill="none" stroke="url(#sunGrad)" stroke-width="50" stroke-linecap="round" />
    
    <!-- Central Main Vertical Ray -->
    <polygon points="490,260 500,4 510,260" fill="url(#sunGrad)" />

    <!-- Left Side Rays -->
    <polygon points="438,268 410,34 452,264" fill="url(#sunGrad)" />
    <polygon points="380,286 322,78 396,280" fill="url(#sunGrad)" />
    <polygon points="328,312 242,142 344,302" fill="url(#sunGrad)" />
    <polygon points="282,348 178,218 300,336" fill="url(#sunGrad)" />
    <polygon points="248,394 132,306 264,380" fill="url(#sunGrad)" />
    <polygon points="228,446 102,400 240,432" fill="url(#sunGrad)" />

    <!-- Right Side Rays -->
    <polygon points="548,264 590,34 562,268" fill="url(#sunGrad)" />
    <polygon points="604,280 678,78 620,286" fill="url(#sunGrad)" />
    <polygon points="656,302 758,142 672,312" fill="url(#sunGrad)" />
    <polygon points="700,336 822,218 718,348" fill="url(#sunGrad)" />
    <polygon points="736,380 868,306 752,394" fill="url(#sunGrad)" />
    <polygon points="760,432 898,400 772,446" fill="url(#sunGrad)" />
  </g>

  <!-- ================= SIDE FRAMING ARCHES ================= -->
  <!-- Left Thin Crest Arch -->
  <path d="M 120 635 A 410 410 0 0 1 270 330" fill="none" stroke="#1B1464" stroke-width="14" stroke-linecap="round" />
  <!-- Right Thin Crest Arch -->
  <path d="M 880 635 A 410 410 0 0 0 730 330" fill="none" stroke="#1B1464" stroke-width="14" stroke-linecap="round" />

  <!-- ================= THE GLOBE ================= -->
  <g id="globe">
    <!-- Globe Base Sphere -->
    <circle cx="475" cy="445" r="172" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="9" />

    <!-- Clip Path for Globe Interior -->
    <clipPath id="globeClip">
      <circle cx="475" cy="445" r="168" />
    </clipPath>

    <g clip-path="url(#globeClip)">
      <!-- Ocean Fill -->
      <rect x="280" y="250" width="390" height="390" fill="#FFFFFF" />

      <!-- North America & South America Continents in Rich Blue -->
      <path d="M 325 320 
               C 345 310, 385 315, 415 300 
               C 440 285, 465 290, 480 305
               C 490 315, 492 335, 475 350
               C 460 365, 462 385, 485 390
               C 505 395, 515 410, 500 425
               C 485 440, 455 435, 440 420
               C 425 405, 410 415, 400 430
               C 390 445, 370 440, 360 420
               C 350 400, 335 390, 320 380
               C 310 360, 312 335, 325 320 Z" 
            fill="#2B6CB0" />

      <path d="M 430 435
               C 455 435, 490 445, 495 470
               C 500 495, 490 525, 475 555
               C 460 585, 445 610, 435 600
               C 425 590, 420 560, 422 535
               C 425 510, 415 480, 405 465
               C 400 450, 412 435, 430 435 Z" 
            fill="#2B6CB0" />

      <!-- Longitude Meridians (White Graticule) -->
      <ellipse cx="475" cy="445" rx="140" ry="168" fill="none" stroke="#B8D5ED" stroke-width="4" />
      <ellipse cx="475" cy="445" rx="80" ry="168" fill="none" stroke="#B8D5ED" stroke-width="4" />
      <ellipse cx="475" cy="445" rx="25" ry="168" fill="none" stroke="#B8D5ED" stroke-width="4" />
      <line x1="475" y1="270" x2="475" y2="620" stroke="#B8D5ED" stroke-width="4" />

      <!-- Latitude Parallels (White Graticule) -->
      <ellipse cx="475" cy="445" rx="168" ry="140" fill="none" stroke="#B8D5ED" stroke-width="4" />
      <ellipse cx="475" cy="445" rx="168" ry="80" fill="none" stroke="#B8D5ED" stroke-width="4" />
      <line x1="300" y1="445" x2="650" y2="445" stroke="#B8D5ED" stroke-width="5" />
      <line x1="315" y1="365" x2="635" y2="365" stroke="#B8D5ED" stroke-width="4" />
      <line x1="315" y1="525" x2="635" y2="525" stroke="#B8D5ED" stroke-width="4" />
    </g>
  </g>

  <!-- ================= THE OPEN BOOK ================= -->
  <g id="open-book">
    <!-- Left Pages Block (Navy Violet) -->
    <path d="M 470 635 
             C 380 610, 240 590, 160 605 
             C 140 610, 135 625, 140 632
             L 165 658
             C 240 640, 375 625, 470 648 Z" 
          fill="#1B1464" />
          
    <path d="M 470 652 
             C 380 630, 245 618, 175 638 
             L 190 664
             C 260 648, 385 638, 470 662 Z" 
          fill="#1B1464" />

    <path d="M 470 668 
             C 385 650, 260 642, 195 668 
             L 215 694
             C 280 672, 395 660, 470 680 Z" 
          fill="#1B1464" />

    <!-- Main Left Open Page Spread -->
    <path d="M 475 640
             C 380 605, 230 585, 145 615
             C 128 622, 128 642, 145 652
             C 235 685, 365 700, 465 682
             Z"
          fill="#1B1464" />

    <!-- Left Page White Slits / Ribbons -->
    <path d="M 175 628 C 255 615, 370 622, 455 645" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <path d="M 195 648 C 275 635, 375 640, 455 660" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <path d="M 225 668 C 295 655, 385 658, 455 674" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Right Pages Block (Navy Violet) -->
    <path d="M 530 635 
             C 620 610, 760 590, 840 605 
             C 860 610, 865 625, 860 632
             L 835 658
             C 760 640, 625 625, 530 648 Z" 
          fill="#1B1464" />

    <path d="M 530 652 
             C 620 630, 755 618, 825 638 
             L 810 664
             C 740 648, 615 638, 530 662 Z" 
          fill="#1B1464" />

    <path d="M 530 668 
             C 615 650, 740 642, 805 668 
             L 785 694
             C 720 672, 605 660, 530 680 Z" 
          fill="#1B1464" />

    <!-- Main Right Open Page Spread -->
    <path d="M 525 640
             C 620 605, 770 585, 855 615
             C 872 622, 872 642, 855 652
             C 765 685, 635 700, 535 682
             Z"
          fill="#1B1464" />

    <!-- Right Page White Slits / Ribbons -->
    <path d="M 825 628 C 745 615, 630 622, 545 645" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <path d="M 805 648 C 725 635, 625 640, 545 660" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <path d="M 775 668 C 705 655, 615 658, 545 674" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Book Center Spine Dot / Hinge -->
    <circle cx="500" cy="658" r="34" fill="#1B1464" />
    <circle cx="500" cy="658" r="14" fill="#FFFFFF" opacity="0.15" />
  </g>

  <!-- ================= SOARING BIRD / DOVE ================= -->
  <g id="soaring-bird">
    <!-- Bird Body, Head, Beak & Wing Feathers -->
    <path d="M 480 630 
             C 520 575, 595 520, 680 470
             C 730 440, 790 380, 830 330
             C 860 290, 890 240, 915 210
             C 900 245, 880 270, 855 300
             C 885 270, 905 240, 925 220
             C 905 260, 875 300, 840 335
             C 865 315, 885 290, 905 270
             C 880 310, 845 350, 805 380
             C 825 365, 845 345, 865 325
             C 835 365, 795 405, 750 435
             C 720 455, 680 480, 645 500
             C 610 520, 560 560, 500 625
             Z" 
          fill="#1B1464" />

    <!-- Bird Upper Wing & Head Silhouette -->
    <path d="M 480 630
             C 540 560, 640 480, 730 380
             C 780 325, 840 260, 900 220
             C 880 250, 840 300, 800 350
             C 780 315, 740 280, 700 295
             C 660 310, 640 325, 620 335
             L 600 335
             C 620 350, 635 365, 638 380
             C 615 390, 580 420, 550 460
             C 520 500, 495 570, 480 630 Z"
          fill="#1B1464" />

    <!-- Bird Eye (Bright Amber) -->
    <circle cx="638" cy="328" r="6.5" fill="#E85D04" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->

  <!-- 1. "GLOBAL" in Trajan/Cinzel Serif Font with Golden Swoop -->
  <g id="text-global">
    <text 
      x="500" 
      y="845" 
      font-family="'Cinzel', 'Times New Roman', 'Trajan Pro', 'Baskerville', serif" 
      font-size="144" 
      font-weight="900" 
      letter-spacing="6" 
      fill="#1B1464" 
      text-anchor="middle"
    >
      GLOBAL
    </text>

    <!-- Golden Swoosh under 'A' and 'L' -->
    <path d="M 720 848 
             C 745 832, 785 815, 842 818 
             C 816 830, 770 844, 726 852 
             Z" 
          fill="url(#goldSwooshGrad)" />
    <path d="M 718 849 
             C 748 830, 800 812, 850 820
             C 824 834, 768 850, 718 849 Z" 
          fill="#FFC107" />
  </g>

  <!-- 2. "— COACHING CLASSES —" with Orange Bars -->
  <g id="text-coaching-classes">
    <!-- Left Orange Tapered Bar -->
    <polygon points="25,904 125,904 125,917 25,917 5,910" fill="#E85D04" />
    
    <!-- Text -->
    <text 
      x="500" 
      y="927" 
      font-family="'Montserrat', 'Arial Black', sans-serif" 
      font-size="65" 
      font-weight="900" 
      letter-spacing="5.5" 
      fill="#1B1464" 
      text-anchor="middle"
    >
      COACHING CLASSES
    </text>

    <!-- Right Orange Tapered Bar -->
    <polygon points="875,904 975,904 995,910 975,917 875,917" fill="#E85D04" />
  </g>

  <!-- 3. "— ANUPGARH —" with Navy Bars -->
  <g id="text-anupgarh">
    <!-- Left Navy Tapered Bar -->
    <polygon points="200,980 320,980 320,991 200,991 180,985" fill="#1B1464" />

    <!-- Text -->
    <text 
      x="500" 
      y="997" 
      font-family="'Montserrat', 'Arial Black', sans-serif" 
      font-size="54" 
      font-weight="900" 
      letter-spacing="20" 
      fill="#1B1464" 
      text-anchor="middle"
    >
      ANUPGARH
    </text>

    <!-- Right Navy Tapered Bar -->
    <polygon points="680,980 800,980 820,985 800,991 680,991" fill="#1B1464" />
  </g>
</svg>
